# ΛCDM + JWST Pop III reionisation model
# Likelihood: full Planck 2018 (high-l + low-l TT + low-l EE + lensing)
#
# Run with (from the repo root):
#   cobaya-run cobaya/setups/yaml/lcdm_planck.yaml

params:
  # --- Reionisation (sampled) ------------------------------------------
  reio_jwst_popIII_logMvcut:
    prior:
      min: 4.0
      max: 8.0
    ref:
      dist: norm
      loc: 7.0
      scale: 0.5
    proposal: 0.3
    latex: '\log M_\mathrm{vcut}'
  reio_jwst_popIII_fesc:
    prior:
      min: 0.05
      max: 0.5
    ref: 0.099
    proposal: 0.005
    latex: 'f_\mathrm{esc}'
  reio_jwst_popIII_a:
    prior:
      dist: norm
      loc: 0.15
      scale: 0.008
    ref: 0.15
    proposal: 0.008
    latex: 'a'
  reio_jwst_popIII_b:
    prior:
      dist: norm
      loc: 28.17
      scale: 0.17
    ref: 28.17
    proposal: 0.17
    latex: 'b'
  reio_jwst_popIII_d:
    prior:
      dist: norm
      loc: 0.05
      scale: 0.02
    ref: 0.05
    proposal: 0.02
    latex: 'd'
  reio_jwst_popIII_zpop:
    prior:
      min: 25
      max: 50
    ref:
      dist: norm
      loc: 35
      scale: 5
    proposal: 1.0
    latex: 'z_\mathrm{pop}'

  # --- Cosmological (sampled) -------------------------------------------
  H0:
    prior:
      min: 20
      max: 100
    ref:
      dist: norm
      loc: 67.36
      scale: 1
    proposal: 0.5
    latex: 'H_0'
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.0002
    proposal: 0.0001
    latex: '\Omega_\mathrm{b} h^2'
  omega_cdm:
    prior:
      min: 0.001
      max: 0.25
    ref:
      dist: norm
      loc: 0.1200
      scale: 0.001
    proposal: 0.0005
    latex: '\Omega_\mathrm{c} h^2'
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.044
      scale: 0.002
    proposal: 0.001
    drop: true
    latex: '\log(10^{10} A_\mathrm{s})'
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: 'A_\mathrm{s}'
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.9649
      scale: 0.004
    proposal: 0.002
    latex: 'n_\mathrm{s}'

  # --- Cosmological (fixed) ----------------------------------------------
  m_ncdm:
    renames: mnu
    value: 0.06
  k_pivot: 0.05
  T_cmb: 2.7255
  Omega_k: 0.0

  # --- Derived -------------------------------------------------------------
  jwst_popIII_tau:
    latex: '\tau_\mathrm{popIII}'
  Omega_m:
    latex: '\Omega_\mathrm{m}'
  YHe:
    latex: 'Y_\mathrm{P}'
  z_reio:
    latex: 'z_\mathrm{re}'
  omegamh2:
    derived: "lambda Omega_m, H0: Omega_m*(H0/100)**2"
    latex: '\Omega_\mathrm{m} h^2'

# ---- Theory -----------------------------------------------------------
theory:
  classy:
    path: /mnt/Data/projects/class_jwst_popIII/class_jwst_popIII
    extra_args:
      YHe: BBN
      recombination: HyRec
      base_path: /mnt/Data/projects/class_jwst_popIII/class_jwst_popIII
      Phi_UV_file: /mnt/Data/projects/class_jwst_popIII/class_jwst_popIII/external/jwst_reio/Phi_UV.dat
      reio_parametrization: reio_jwst_popIII
      N_ncdm: 1
      N_ur: 2.0328

# ---- Likelihood ---------------------------------------------------------
# Full Planck 2018: high-l + low-l TT + low-l EE + lensing
likelihood:
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_lensing.clik:

# ---- External prior on logMvcut ------------------------------------------
prior:
  log_cutoff_bound: "lambda reio_jwst_popIII_logMvcut, omega_cdm, omega_b: 0.0 if reio_jwst_popIII_logMvcut + 0.5 * np.log10((omega_cdm + omega_b) / 0.143) < 8.0 else -np.inf"

# ---- Sampler --------------------------------------------------------------
sampler:
  mcmc:
    covmat: auto
    burn_in: 0
    Rminus1_stop: 0.01
    learn_proposal: true
    learn_every: 20d
    measure_speeds: true
    drag: true
    oversample_power: 0.4
    learn_proposal_Rminus1_max_early: 100

# ---- Output -----------------------------------------------------------
output: cobaya/output/lcdm_planck/lcdm_planck
resume: true
